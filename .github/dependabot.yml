version: 2
updates:
  # Python backend dependencies
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Stripe SDK majors change the payment/payout boundaries that the funding
      # and setup ledgers pin in tests. Upgrade deliberately with a payment
      # review; pip-audit in CI still flags any advisory on the pinned version.
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "deps(backend)"
      include: scope

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "deps(ci)"
      include: scope
