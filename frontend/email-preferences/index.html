<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Email preferences | GoHireHumans</title>
  <style>
    body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1f2937;background:#f8fafc}
    main{max-width:32rem;margin:12vh auto;padding:2rem;background:#fff;border:1px solid #e5e7eb;border-radius:12px}
    h1{font-size:1.35rem;margin:0 0 .75rem}
    button{font:inherit;font-weight:600;padding:.65rem 1.1rem;border:0;border-radius:8px;background:#1d4ed8;color:#fff;cursor:pointer}
    button:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
    button[disabled]{opacity:.6;cursor:default}
    #status{margin-top:1rem;min-height:1.5em}
    a{color:#1d4ed8}
  </style>
</head>
<body>
  <main>
    <h1>Daily applicant emails</h1>
    <p>These emails tell you once a day when people apply to a job you posted on GoHireHumans.</p>
    <button id="stop" type="button">Stop these emails</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p><a href="/">Back to GoHireHumans</a></p>
  </main>
  <script>
    (function () {
      var API = 'https://gohirehumans-production.up.railway.app';
      var token = new URLSearchParams(location.search).get('t') || '';
      // Keep the capability out of history, screenshots and any later navigation.
      if (location.search) history.replaceState(null, '', location.pathname);
      var button = document.getElementById('stop');
      var status = document.getElementById('status');
      if (!/^[1-9][0-9]{0,17}\.[0-9a-f]{32}$/.test(token)) {
        button.disabled = true;
        status.textContent = 'This link is incomplete. Open the "Stop these emails" link from the email again.';
        return;
      }
      button.addEventListener('click', function () {
        button.disabled = true;
        status.textContent = 'Saving…';
        fetch(API + '/email-preferences/unsubscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
          body: JSON.stringify({ token: token })
        }).then(function (res) {
          if (res.ok) {
            status.textContent = 'Done. You will not get daily applicant emails anymore.';
            button.hidden = true;
          } else {
            status.textContent = 'This link is not valid anymore. Email gohirehumans.operations@agentmail.to and we will stop them.';
          }
        }).catch(function () {
          button.disabled = false;
          status.textContent = 'Could not reach GoHireHumans. Please try again.';
        });
      });
    })();
  </script>
</body>
</html>
