[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gohirehumans-mcp"
version = "2.2.0"
description = "GoHireHumans MCP server for service discovery and owner-authorized marketplace operations"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "GoHireHumans", email = "gohirehumans.operations@agentmail.to"}]
keywords = ["mcp", "model-context-protocol", "marketplace", "human-in-the-loop", "ai-agent"]
dependencies = []

[project.scripts]
gohirehumans-mcp = "mcp_server:main"

[project.urls]
Homepage = "https://www.gohirehumans.com"
Documentation = "https://www.gohirehumans.com/api-docs.html"
Repository = "https://github.com/profilesearch/GohireHumans"

[tool.setuptools]
py-modules = ["mcp_server"]
